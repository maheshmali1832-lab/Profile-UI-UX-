<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-Card</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .con{
            height: 750px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 70%;
            width: 70%;
            /* border: 1px solid black; */
            display: flex;
              box-shadow: 10px 10px 10px;
              border-radius: 20px;
        }
        .left, .right, .center{
            /* border: 1px solid black; */
            height: 100%;
        }
        .left{
            width: 2%;
            background-color: rgb(10, 10, 79);
            border-radius: 30px;
        }
        .center{
            width: 62%;
            font-weight: bolder;
            font-size: 100px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgb(1, 1, 132);
            /* background-color: rgb(253, 253, 253); */
            background-color: whitesmoke;
        }
        p{
            margin-left: 10px;
        }
        .right{
            width: 36%;
            border-radius: 10px;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .top{
            /* border: 1px solid black; */
            height: 30%;
            width: 100%;
        }
        .top-in{
            height: 90%;
            border: 1px solid black;
            background-color: navy;
            /* border-radius: 20px; */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            /* border-bottom-left-radius: 20px; */
            /* border-bottom-right-radius: 20px; */
        }
        .bottom{
            height: 70%;
            /* border: 1px solid black; */
        }
        .circle{
            position:absolute;
            height: 125px;
            width: 125px;
            /* border: 5px solid navy; */

            border-radius: 50%;
            top: 145px;
            right: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            /* border: 3px solid white; */
        }
        .bottom>h1{
            text-align: center;
        }
        .button{
            height: 20%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .button1,.button2{
            border-radius: 20px;
            color: white;
            height: 50%;
            width: 40%;
            background-color: red;
            text-align: center;
            line-height: 30px;
            
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-heart{
            color: red;
        }
        .fa-share{
            color: blue;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(red,orange,pink);
            color: transparent;
            background-clip: text;
            
        }
        .fa-linkedin{
            color: blue;
        }
        .fa-github{
            color: black;
        }
        .fa-behance{
            color: dimgrey;

        }
        
        
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <p>Profile Card UI UX Design</p>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="logo.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website developer </h1>
                    <h1>Dezyne Ecole college</h1>
                    <h1>BCA 1<sup>st</sup> Year</h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                         <i class="fa fa-brands fa-linkedin fa-2x"></i>
                          <i class="fa fa-brands fa-github fa-2x"></i>
                           <i class="fa fa-brands fa-behance fa-2x"></i>

                    </div>
                    <div class="button">
                        <div class="button1">
                            <h1>like</h1>
                        </div>
                        <div class="button2">
                            <h1>subscribe</h1>
                            </div>
                            
                        
                    </div>
                    <div class="icon">
                        <i class="fa fa-solid fa-heart fa-2x"></i>60.4k
                        <i class="fa fa-solid fa-comment fa-2x"></i>20k
                         <i class="fa fa-solid fa-share fa-2x"></i>12.6k
                          
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
